name: Publish baseline
# Each run is listed as "Publish baseline-<type>", e.g. Publish baseline-networking.
run-name: Publish baseline-${{ inputs.type }}

# Builds one baseline type from polyci.json (kernel + base rootfs, no lab) and
# publishes it as a PRE-RELEASE tagged baseline-<type>-<hash>, where <hash>
# covers the Buildroot version, the full config set and the builder's build
# script. Same inputs, same tag; any change, new tag.
#
# Then: test it (Build labs -> Run workflow, baseline_override TYPE=TAG),
# promote it (gh release edit TAG --prerelease=false --latest=false), and pin
# it in polyci.json (baselines.TYPE.release) in a pull request.

on:
  workflow_dispatch:
    inputs:
      type:
        description: Baseline type (from polyci.json)
        type: choice
        options: [basic, filesystem, networking, snort-defender, snort-attacker]

# Read-only by default; only the publish job can write (create the release).
permissions:
  contents: read

concurrency:
  group: baseline-${{ inputs.type }}
  cancel-in-progress: false

jobs:
  # The slow part (Buildroot, ~35 min). Ends by saving the release files as an
  # artifact, so if publishing fails, "Re-run failed jobs" only re-runs the
  # quick publish job below, not the build.
  baseline:
    name: Build baseline-${{ inputs.type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      buildroot_version: ${{ steps.cfg.outputs.buildroot_version }}
    steps:
      - name: Check out PolyCI
        uses: actions/checkout@v7
        with:
          path: polyci

      - name: Read polyci.json
        id: cfg
        env:
          TYPE: ${{ inputs.type }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          cfg = json.load(open("polyci/polyci.json"))
          t = os.environ["TYPE"]
          b = cfg["baselines"].get(t)
          if b is None:
              sys.exit(f"::error::baseline type {t!r} is not in polyci.json")
          if b.get("enabled", True) is False or not b.get("config_set"):
              sys.exit(f"::error::baseline type {t!r} is disabled or has no config_set in polyci.json")
          lab = b.get("from_lab") or {}
          if lab and bool(lab.get("install_script")) == bool(lab.get("config_dir")):
              sys.exit(f"::error::baselines.{t}.from_lab needs exactly one of install_script or config_dir")
          cd = lab.get("config_dir", "")
          if cd and (cd.startswith("/") or ".." in cd.split("/")):
              sys.exit(f"::error::baselines.{t}.from_lab.config_dir must be a path inside the repo")
          extra = b.get("extra_config") or []
          bad = [x for x in extra if not x.startswith("BR2_") or "=" not in x or "\n" in x]
          if bad:
              sys.exit(f"::error::extra_config entries must look like BR2_FOO=y: {bad}")
          with open("polyci-extra.config", "w") as fh:
              fh.writelines(x + "\n" for x in extra)
          out = {
              "config_set": b["config_set"],
              "builder_repo": cfg["builder"]["repo"],
              "builder_ref": cfg["builder"]["ref"],
              "buildroot_version": cfg["builder"]["buildroot_version"],
              "lab_repo": lab.get("repo", ""),
              "lab_ref": lab.get("ref", ""),
              "lab_install": lab.get("install_script", ""),
              "lab_config_dir": lab.get("config_dir", ""),
          }
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              for k, v in out.items():
                  fh.write(f"{k}={v}\n")
          print(json.dumps(out, indent=2))
          PY

      - name: Check out buildroot-builder2
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.cfg.outputs.builder_repo }}
          ref: ${{ steps.cfg.outputs.builder_ref }}
          path: builder

      - name: Check out the lab that defines this config set
        if: steps.cfg.outputs.lab_repo != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.cfg.outputs.lab_repo }}
          ref: ${{ steps.cfg.outputs.lab_ref }}
          path: lab

      - name: Install the lab's config set into the builder
        if: steps.cfg.outputs.lab_repo != ''
        env:
          INSTALL: ${{ steps.cfg.outputs.lab_install }}
          CONFIG_DIR: ${{ steps.cfg.outputs.lab_config_dir }}
          CONFIG_SET: ${{ steps.cfg.outputs.config_set }}
        run: |
          if [ -n "$INSTALL" ]; then
            sh "lab/$INSTALL" "$GITHUB_WORKSPACE/builder"
          else
            # config_dir: copy the folder in as builder/config-sets/<config_set>,
            # as the lab's README says (its defconfig points at
            # ../../../config-sets/<config_set>/linux.config).
            [ -f "lab/$CONFIG_DIR/defconfig" ] || { echo "::error::lab/$CONFIG_DIR/defconfig not found"; exit 1; }
            rm -rf "builder/config-sets/$CONFIG_SET"
            cp -a "lab/$CONFIG_DIR" "builder/config-sets/$CONFIG_SET"
            ls -l "builder/config-sets/$CONFIG_SET"
          fi

      - name: Adjust the config set (drop host QEMU, add extra_config)
        env:
          CONFIG_SET: ${{ steps.cfg.outputs.config_set }}
        run: |
          dir=builder/config-sets/"$CONFIG_SET"
          [ -d "$dir" ] || { echo "::error::config set $CONFIG_SET not found in the builder"; exit 1; }
          for f in "$dir"/defconfig "$dir"/*.fragment; do
            [ -f "$f" ] && sed -i '/^BR2_PACKAGE_HOST_QEMU/d' "$f"
          done
          ! grep -h '^BR2_PACKAGE_HOST_QEMU' "$dir"/*
          # extra_config from polyci.json goes at the end of features.fragment,
          # which 02-build-baseline.sh appends after the defconfig (last value
          # wins). It is part of the config set, so it changes the tag hash.
          if [ -s polyci-extra.config ]; then
            f="$dir/features.fragment"
            [ ! -s "$f" ] || [ -z "$(tail -c1 "$f")" ] || echo >> "$f"
            { echo "# Added by PolyCI (polyci.json extra_config)"; cat polyci-extra.config; } >> "$f"
            echo "Appended to $f:"; cat polyci-extra.config
          fi

      - name: Work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          TYPE: ${{ inputs.type }}
          CONFIG_SET: ${{ steps.cfg.outputs.config_set }}
          BUILDROOT_VERSION: ${{ steps.cfg.outputs.buildroot_version }}
        run: |
          # Hash = Buildroot version + every config-set file (README.md aside)
          # + the builder's shared config-common/ files, if it has them (a set's
          # `includes` and kernel config can point there) + the build script.
          h=$( { echo "buildroot $BUILDROOT_VERSION"
                 for f in $(cd builder/config-sets/"$CONFIG_SET" && ls | sort); do
                   [ "$f" = README.md ] && continue
                   echo "== $f"; cat builder/config-sets/"$CONFIG_SET"/"$f"
                 done
                 if [ -d builder/config-common ]; then
                   for f in $(cd builder/config-common && ls | sort); do
                     echo "== config-common/$f"; cat builder/config-common/"$f"
                   done
                 fi
                 echo "== 02-build-baseline.sh"; cat builder/scripts/02-build-baseline.sh
               } | sha256sum | cut -c1-10)
          tag="baseline-${TYPE}-${h}"
          echo "hash=$h" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists: this exact baseline was already built. Delete it first if you really mean to rebuild it."
            exit 1
          fi
          echo "Will publish $tag"

      - name: Free disk space for Buildroot
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Restore Buildroot download cache
        uses: actions/cache@v6
        with:
          path: br-dl
          key: br-dl-${{ steps.cfg.outputs.buildroot_version }}-${{ steps.tag.outputs.tag }}
          restore-keys: br-dl-${{ steps.cfg.outputs.buildroot_version }}-

      - name: Build baseline (kernel + rootfs)
        env:
          BR2_DL_DIR: ${{ github.workspace }}/br-dl
          BUILDROOT_VERSION: ${{ steps.cfg.outputs.buildroot_version }}
          CONFIG_SET: ${{ steps.cfg.outputs.config_set }}
        run: |
          unset LD_LIBRARY_PATH PERL_MM_OPT
          bash builder/scripts/01-setup-buildroot.sh
          bash builder/scripts/02-build-baseline.sh --config "$CONFIG_SET"
          dir=$(ls -d builder/artifacts/"$CONFIG_SET"-* | sort | tail -n1)
          mkdir -p baseline
          cp -a "$dir"/. baseline/

      - name: Check the build kept every requested package
        env:
          CONFIG_SET: ${{ steps.cfg.outputs.config_set }}
        run: |
          # Buildroot silently drops options whose dependencies are not met
          # (e.g. bash needs BR2_PACKAGE_BUSYBOX_SHOW_OTHERS). Stop here rather
          # than publish a baseline that labs will fail on.
          python3 polyci/scripts/check-baseline.py \
            --config-set builder/config-sets/"$CONFIG_SET" \
            --common-dir builder/config-common \
            --final-config baseline/configs/final-buildroot.config \
            --rootfs baseline/images/rootfs.cpio.gz \
            --required builder/config-sets/"$CONFIG_SET"/required-commands.txt

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-${{ inputs.type }}-build-logs
          path: builder/artifacts/*/logs/
          if-no-files-found: ignore

      - name: Smoke test (bare base boots to a login prompt)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pexpect
          python3 - <<'PY'
          import pexpect, sys
          vm = pexpect.spawn("qemu-system-i386 -m 512M -nographic -no-reboot "
                             "-kernel baseline/images/bzImage -initrd baseline/images/rootfs.cpio.gz "
                             "-append 'console=ttyS0 panic=-1'", encoding="utf-8",
                             codec_errors="replace", timeout=300)
          vm.logfile_read = open("baseline-smoke.log", "w")
          if vm.expect([r"login: ?", r"Kernel panic[^\r\n]*", pexpect.EOF]) != 0:
              print(f"::error::bare baseline did not reach a login prompt: {vm.after}")
              sys.exit(1)
          print("bare baseline boots to a login prompt")
          vm.terminate(force=True)
          PY

      - name: Assemble release files
        env:
          TYPE: ${{ inputs.type }}
          TAG: ${{ steps.tag.outputs.tag }}
          HASH: ${{ steps.tag.outputs.hash }}
          CONFIG_SET: ${{ steps.cfg.outputs.config_set }}
          BUILDROOT_VERSION: ${{ steps.cfg.outputs.buildroot_version }}
          BUILDER_REPO: ${{ steps.cfg.outputs.builder_repo }}
          BUILDER_REF: ${{ steps.cfg.outputs.builder_ref }}
          LAB_REPO: ${{ steps.cfg.outputs.lab_repo }}
          LAB_REF: ${{ steps.cfg.outputs.lab_ref }}
        run: |
          mkdir -p dist
          cp baseline/images/bzImage baseline/images/rootfs.cpio.gz dist/
          tar -czf dist/baseline-manifest.tar.gz -C baseline configs manifest logs
          python3 - <<'PY'
          import hashlib, json, os, datetime
          e = os.environ
          sha = lambda p: hashlib.sha256(open(p, "rb").read()).hexdigest()
          info = {
              "tag": e["TAG"], "type": e["TYPE"], "hash": e["HASH"],
              "config_set": e["CONFIG_SET"], "buildroot_version": e["BUILDROOT_VERSION"],
              "builder": {"repo": e["BUILDER_REPO"], "commit": e["BUILDER_REF"]},
              "config_from_lab": {"repo": e["LAB_REPO"], "commit": e["LAB_REF"]} if e["LAB_REPO"] else None,
              "extra_config": [l for l in open("polyci-extra.config").read().splitlines() if l],
              "host_qemu_removed": True,
              "kernel_sha256": sha("dist/bzImage"),
              "rootfs_sha256": sha("dist/rootfs.cpio.gz"),
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
              "built_by": f'{e["GITHUB_SERVER_URL"]}/{e["GITHUB_REPOSITORY"]}/actions/runs/{e["GITHUB_RUN_ID"]}',
          }
          json.dump(info, open("dist/baseline.json", "w"), indent=2)
          PY
          (cd dist && sha256sum bzImage rootfs.cpio.gz baseline-manifest.tar.gz baseline.json > SHA256SUMS)
          cat dist/baseline.json
          cat > notes.md <<EOF
          Baseline **$TYPE**: kernel + base rootfs, no lab payload.

          | | |
          |---|---|
          | Config set | \`$CONFIG_SET\` |
          | Buildroot | $BUILDROOT_VERSION |
          | Builder | $BUILDER_REPO @ \`${BUILDER_REF:0:12}\` |
          | Config from | ${LAB_REPO:-builder} ${LAB_REF:+@ \`${LAB_REF:0:12}\`} |

          **Status:** pre-release until tested.
          1. Test: Actions → Build labs → Run workflow, \`baseline_override: $TYPE=$TAG\`.
          2. Promote: \`gh release edit $TAG --prerelease=false --latest=false\`.
          3. Pin: set \`baselines.$TYPE.release\` to \`$TAG\` in polyci.json.
          EOF

      - name: Save release files for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: baseline-${{ inputs.type }}-release
          path: |
            dist/
            notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish baseline-${{ inputs.type }} pre-release
    needs: baseline
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
    steps:
      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: baseline-${{ inputs.type }}-release
          path: .

      - name: Publish ${{ needs.baseline.outputs.tag }} as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.baseline.outputs.tag }}
          TYPE: ${{ inputs.type }}
          BUILDROOT_VERSION: ${{ needs.baseline.outputs.buildroot_version }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          fi
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Baseline $TYPE (Buildroot $BUILDROOT_VERSION, ${TAG##*-})" \
            --notes-file notes.md \
            dist/bzImage dist/rootfs.cpio.gz dist/baseline-manifest.tar.gz dist/baseline.json dist/SHA256SUMS
          {
            echo "### Published pre-release \`$TAG\`"
            echo "1. Test: **Build labs** → Run workflow with \`baseline_override\` = \`$TYPE=$TAG\`."
            echo "2. Promote: \`gh release edit $TAG --prerelease=false --latest=false\`"
            echo "3. Pin it: \`baselines.$TYPE.release = \"$TAG\"\` in polyci.json."
          } >> "$GITHUB_STEP_SUMMARY"
