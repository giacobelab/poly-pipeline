name: Build labs
# Manual runs say what they test, e.g. "Build labs: test networking=baseline-networking-fc3d6448a7".
# Push and PR runs keep GitHub's usual name (commit message or PR title): an
# empty run-name falls back to it.
run-name: >-
  ${{ github.event_name != 'workflow_dispatch' && ' ' ||
      inputs.baseline_override != '' && format('Build labs: test {0}{1}', inputs.baseline_override, inputs.promote && ' and pin' || '') ||
      inputs.labs != '' && format('Build labs: {0}', inputs.labs) ||
      inputs.force && 'Build labs: full rebuild' || 'Build labs' }}

# For every lab in polyci.json, scripts/plan.py picks a mode:
#   build  1. check out the lab repo at its pinned commit
#          2. download its baseline release (baseline-<type>-<hash>) and verify it
#          3. build lab.cpio.gz from the lab's folder (make-overlay.py, reproducible)
#          4. join: packaged.rootfs.cpio.gz = baseline rootfs.cpio.gz + lab.cpio.gz
#          5. test: image check, then the QEMU boot test and the headless-Chrome
#             play of the v86 page, in parallel
#          6. on the default branch, publish <lab>-<commit>-<baselinehash>-release
#   reuse  that release already exists and was made by this same pipeline:
#          download it and rebuild the web page only (seconds)
#   skip   no baseline pinned for the lab's type yet
# then deploy every lab's page to GitHub Pages under one landing page.
# The weekly run (and a run with "force") always does full builds.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  schedule:
    - cron: '41 7 * * 1'   # weekly full rebuild: catches runner or dependency drift
  workflow_dispatch:
    inputs:
      labs:
        description: Only these labs (comma-separated ids from polyci.json; blank = all)
        default: ''
      baseline_override:
        description: "Baselines to test before pinning: latest (every newer one), type names (snort-defender,snort-attacker) or tags"
        default: ''
      promote:
        description: If every lab passes on the override, mark those baselines as full releases and open a PR pinning them in polyci.json
        type: boolean
        default: false
      force:
        description: Rebuild and retest every lab, even ones already released by this pipeline
        type: boolean
        default: false
      publish:
        description: Publish releases and Pages from this run (default branch only; never with an override)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; jobs that publish ask for more themselves.
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      groups: ${{ steps.plan.outputs.groups }}
      group_count: ${{ steps.plan.outputs.group_count }}
      any_build: ${{ steps.plan.outputs.any_build }}
      overrides: ${{ steps.plan.outputs.overrides }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan the lab matrix
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          LABS: ${{ inputs.labs }}
          OVERRIDE: ${{ inputs.baseline_override }}
          FULL: ${{ github.event_name == 'schedule' || inputs.force == true }}
        run: |
          check=()
          [ "$FULL" = true ] || check=(--check-releases "$GITHUB_REPOSITORY")
          python3 scripts/plan.py --labs "$LABS" --baseline-override "$OVERRIDE" \
            "${check[@]}" --github-output "$GITHUB_OUTPUT" | tee plan.txt
          { echo '### Plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Decide whether to publish
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          ON_DEFAULT: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          WANT: ${{ inputs.publish }}
          OVERRIDE: ${{ inputs.baseline_override }}
        run: |
          publish=false
          if [ "$ON_DEFAULT" = true ] && [ -z "$OVERRIDE" ]; then
            { [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$WANT" = true ]; }; } && publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Publish releases and Pages from this run: $publish"

  # The QEMU boot-test tools, built once into an image and reused by every lab
  # job. Rebuilt only when tools/Dockerfile changes (the tag is its hash).
  tools:
    needs: plan
    if: needs.plan.outputs.any_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tools
      - name: Build and push the tools image if it doesn't exist yet
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/polyci-qemu:$(sha256sum tools/Dockerfile | cut -c1-12)"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "$image already exists"
          else
            docker build --build-arg "SOURCE_REPO=https://github.com/$GITHUB_REPOSITORY" -t "$image" tools
            docker push "$image"
          fi

  lab:
    name: lab (${{ matrix.lab }})
    needs: [plan, tools]
    # Run even when the tools job was skipped (every lab reused or skipped).
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' && needs.tools.result != 'failure' && needs.tools.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # publish <lab>-...-release (only on the default branch)
      packages: read    # pull the tools image
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LAB: ${{ matrix.lab }}
      TITLE: ${{ matrix.title }}
      REF: ${{ matrix.ref }}
      SUBDIR: ${{ matrix.subdir }}
      RENAMES: ${{ matrix.renames }}
      BASELINE_TYPE: ${{ matrix.baseline_type }}
      BASELINE_TAG: ${{ matrix.baseline_tag }}
      BASELINE_IS_OVERRIDE: ${{ matrix.baseline_is_override }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      FINGERPRINT: ${{ matrix.fingerprint }}
      MODE: ${{ matrix.mode }}
      TOOLS_IMAGE: ${{ needs.tools.outputs.image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: "Mode: ${{ matrix.mode }}"
        env:
          WHY: ${{ matrix.why }}
        run: |
          echo "$LAB: $MODE ($WHY)"
          echo "**$LAB**: $MODE ($WHY)" >> "$GITHUB_STEP_SUMMARY"
          [ "$MODE" != skip ] || echo "::notice::$LAB skipped: $WHY. Run Publish baseline, then pin it in polyci.json."

      - name: Start pulling the tools image
        if: matrix.mode == 'build'
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # In the background, so it overlaps with the steps below.
          ( docker pull -q "$TOOLS_IMAGE" > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.rc" ) &

      - name: Check out PolyCI
        if: matrix.mode != 'skip'
        uses: actions/checkout@v7
        with:
          path: polyci

      - name: Check out ${{ matrix.repo }} @ ${{ matrix.ref }}
        if: matrix.mode != 'skip'
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: lab

      - name: Level settings (from the lab's lab.json)
        if: matrix.mode != 'skip'
        id: settings
        env:
          USERS: ${{ matrix.users }}
          LEVELS: ${{ matrix.levels }}
        run: python3 polyci/scripts/lab-settings.py lab --users "$USERS" --levels "$LEVELS" --github-output "$GITHUB_OUTPUT"

      # ---- reuse: the released images are already tested ----
      - name: Download released images (${{ matrix.release_tag }})
        if: matrix.mode == 'reuse'
        run: |
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -D out \
            -p packaged.bzImage -p packaged.rootfs.cpio.gz -p release.json -p SHA256SUMS
          (cd out && sha256sum -c --ignore-missing SHA256SUMS)

      # ---- build ----
      - name: Download baseline ${{ matrix.baseline_tag }}
        if: matrix.mode == 'build'
        run: |
          pre=$(gh release view "$BASELINE_TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease) \
            || { echo "::error::Baseline release $BASELINE_TAG not found"; exit 1; }
          if [ "$pre" = true ] && [ "$BASELINE_IS_OVERRIDE" != true ]; then
            echo "::error::$BASELINE_TAG is still a pre-release. Promote it before pinning it in polyci.json."
            exit 1
          fi
          gh release download "$BASELINE_TAG" -R "$GITHUB_REPOSITORY" -D base \
            -p bzImage -p rootfs.cpio.gz -p baseline-manifest.tar.gz -p baseline.json -p SHA256SUMS
          (cd base && sha256sum -c SHA256SUMS)
          tar -xzf base/baseline-manifest.tar.gz -C base
          echo "Baseline $BASELINE_TAG (pre-release: $pre)"

      - name: Lab self-test (${{ matrix.self_test }})
        if: matrix.mode == 'build' && matrix.self_test != ''
        working-directory: lab
        run: sh "${{ matrix.self_test }}"

      - name: Build lab.cpio.gz and join it onto the baseline
        if: matrix.mode == 'build'
        run: |
          mkdir -p out
          # shellcheck disable=SC2086  # RENAMES is a list of --rename args
          python3 polyci/scripts/make-overlay.py --repo lab --ref "$REF" --subdir "$SUBDIR" \
            $RENAMES --out out/lab.cpio.gz --manifest out/lab-manifest.txt
          cat base/rootfs.cpio.gz out/lab.cpio.gz > out/packaged.rootfs.cpio.gz
          cp base/bzImage out/packaged.bzImage
          ls -l out

      - name: Verify the joined image
        if: matrix.mode == 'build'
        run: |
          python3 polyci/scripts/verify-image.py \
            --packaged out/packaged.rootfs.cpio.gz --base base/rootfs.cpio.gz \
            --lab out/lab.cpio.gz --manifest out/lab-manifest.txt \
            --required base/manifest/required-commands.txt

      # ---- the web page (both build and reuse) ----
      - name: v86 settings
        if: matrix.mode != 'skip'
        id: v86
        run: |
          jq -r '"version=\(.v86.npm_version)\nbios_repo=\(.v86.bios_repo)\nbios_ref=\(.v86.bios_ref)"' \
            polyci/polyci.json >> "$GITHUB_OUTPUT"

      - name: Check out v86 BIOS files
        if: matrix.mode != 'skip'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.v86.outputs.bios_repo }}
          ref: ${{ steps.v86.outputs.bios_ref }}
          path: v86src
          sparse-checkout: bios
          sparse-checkout-cone-mode: false

      - name: Assemble the v86 page
        if: matrix.mode != 'skip'
        env:
          V86_VERSION: ${{ steps.v86.outputs.version }}
          LABEL: ${{ matrix.release_tag }}
          LEVELS: ${{ steps.settings.outputs.levels }}
          SERVER: ${{ matrix.server && '1' || '0' }}
        run: LAB_JSON=lab/lab.json bash polyci/scripts/assemble-site.sh out v86src/bios site

      # ---- tests (build only), boot test and page test side by side ----
      - name: Cache the page test's browser driver
        if: matrix.mode == 'build'
        id: pt-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/polyci-page-test
          key: puppeteer-core-24-${{ runner.os }}

      - name: Install the page test's browser driver
        if: matrix.mode == 'build' && steps.pt-cache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.cache/polyci-page-test --silent --no-audit --no-fund puppeteer-core@24

      - name: Boot test (QEMU) and page test (Chrome), in parallel
        if: matrix.mode == 'build'
        timeout-minutes: 30
        env:
          BOOT_TEST: ${{ matrix.boot_test }}
          USERS: ${{ steps.settings.outputs.users }}
          LEVELS: ${{ steps.settings.outputs.levels }}
          SERVER: ${{ matrix.server }}
        run: |
          # A lab whose values come from the PolyLab server is tested with a
          # throwaway key: the boot test appends a student archive made with
          # it, and the page test runs against server/polylab_server.py.
          scenario=()
          if [ "$SERVER" = true ]; then
            POLYLAB_KEY=$(python3 polyci/server/polylab_server.py new-key)
            export POLYLAB_KEY POLYLAB_DATA="$RUNNER_TEMP/polylab-data"
            python3 polyci/server/polylab_server.py archive --lab "$LAB" --email ci-test@psu.edu \
              --out out/student.cpio.gz
            scenario=(--scenario out/student.cpio.gz)
          fi
          # Tools image: wait for the background pull to finish.
          while [ ! -f "$RUNNER_TEMP/pull.rc" ]; do sleep 1; done
          [ "$(cat "$RUNNER_TEMP/pull.rc")" = 0 ] || { cat "$RUNNER_TEMP/pull.log"; echo "::error::could not pull $TOOLS_IMAGE"; exit 1; }
          kvm=(); flag=
          if [ -e /dev/kvm ]; then kvm=(--device /dev/kvm); flag=--kvm; fi
          echo "KVM: ${flag:-not available, using emulation}"

          docker run --rm "${kvm[@]}" -v "$PWD:/w" -w /w "$TOOLS_IMAGE" \
            python3 polyci/scripts/boot-test.py --flavor "$BOOT_TEST" --users "$USERS" --levels "$LEVELS" \
              --kernel out/packaged.bzImage --initrd out/packaged.rootfs.cpio.gz --log out/boot.log $flag \
              "${scenario[@]}" > out/boot-test.txt 2>&1 &
          boot=$!

          pt=~/.cache/polyci-page-test
          cp polyci/scripts/page-test.mjs "$pt/"
          if [ "$SERVER" = true ]; then
            mkdir -p siteroot && cp -r site "siteroot/$LAB"
            python3 polyci/server/polylab_server.py serve --site siteroot --port 8080 > out/server.log 2>&1 &
            url="http://127.0.0.1:8080/$LAB/"
          else
            python3 -m http.server 8080 --directory site --bind 127.0.0.1 >/dev/null 2>&1 &
            url="http://127.0.0.1:8080/"
          fi
          sleep 1
          node "$pt/page-test.mjs" "$url" out/page-shots "$USERS" > out/page-test.txt 2>&1 &
          page=$!

          b=0; wait "$boot" || b=$?
          p=0; wait "$page" || p=$?
          # Print each log in full; their ::error:: lines become annotations.
          echo "::group::Boot test (exit $b)"; cat out/boot-test.txt; echo "::endgroup::"
          echo "::group::Page test (exit $p)"; cat out/page-test.txt; echo "::endgroup::"
          grep -h '^::error::' out/boot-test.txt out/page-test.txt || true
          echo "boot test: $([ $b = 0 ] && echo passed || echo FAILED)   page test: $([ $p = 0 ] && echo passed || echo FAILED)"
          [ "$b" = 0 ] && [ "$p" = 0 ]

      - name: Upload test logs and screenshots
        if: always() && matrix.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.lab }}
          path: |
            out/boot.log
            out/boot-test.txt
            out/page-test.txt
            out/page-shots/
            out/server.log
          if-no-files-found: ignore

      - name: Release files
        if: matrix.mode == 'build'
        env:
          REPO: ${{ matrix.repo }}
          SERVER: ${{ matrix.server }}
        run: |
          mkdir -p dist
          cp out/packaged.bzImage out/packaged.rootfs.cpio.gz out/lab.cpio.gz out/lab-manifest.txt dist/
          python3 - <<'PY'
          import hashlib, json, os
          e = os.environ
          sha = lambda p: hashlib.sha256(open(p, "rb").read()).hexdigest()
          base = json.load(open("base/baseline.json"))
          info = {
              "tag": e["RELEASE_TAG"], "lab": e["LAB"], "title": e["TITLE"],
              "lab_repo": e["REPO"], "lab_commit": e["REF"], "lab_folder": e["SUBDIR"],
              "baseline": {"tag": e["BASELINE_TAG"], "type": e["BASELINE_TYPE"],
                           "kernel_sha256": base["kernel_sha256"], "rootfs_sha256": base["rootfs_sha256"]},
              "lab_cpio_sha256": sha("dist/lab.cpio.gz"),
              "packaged_rootfs_sha256": sha("dist/packaged.rootfs.cpio.gz"),
              "join": "packaged.rootfs.cpio.gz = baseline rootfs.cpio.gz + lab.cpio.gz (byte concatenation)",
              "fingerprint": e["FINGERPRINT"],
              "polyci_commit": e["GITHUB_SHA"],
              "built_by": f'{e["GITHUB_SERVER_URL"]}/{e["GITHUB_REPOSITORY"]}/actions/runs/{e["GITHUB_RUN_ID"]}',
          }
          json.dump(info, open("dist/release.json", "w"), indent=2)
          PY
          files=(packaged.bzImage packaged.rootfs.cpio.gz lab.cpio.gz lab-manifest.txt release.json)
          if [ "$SERVER" = true ]; then
            # Server labs are not on GitHub Pages: the finished page goes in the
            # release, to unpack on the PolyLab server (see server/README.md).
            tar -czf dist/site.tar.gz -C site .
            files+=(site.tar.gz)
          fi
          (cd dist && sha256sum "${files[@]}" > SHA256SUMS)
          cat dist/release.json

      - name: Upload images
        if: matrix.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release_tag }}
          path: dist/

      - name: Upload site for the Pages deploy
        if: matrix.mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.lab }}
          path: site/
          retention-days: 7

      - name: Publish ${{ matrix.release_tag }}
        if: matrix.mode == 'build' && needs.plan.outputs.publish == 'true'
        env:
          REPO: ${{ matrix.repo }}
        run: |
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Same lab commit on the same baseline, rebuilt because PolyCI's
            # pipeline changed. Packaging is reproducible, so if the images are
            # byte-identical, just record the new fingerprint; never replace images.
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p release.json -O old-release.json
            same=$(python3 -c "import json; o=json.load(open('old-release.json')); n=json.load(open('dist/release.json')); print(o['packaged_rootfs_sha256']==n['packaged_rootfs_sha256'] and o['lab_cpio_sha256']==n['lab_cpio_sha256'])")
            if [ "$same" = True ]; then
              extra=(); [ ! -f dist/site.tar.gz ] || extra=(dist/site.tar.gz)
              gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber dist/release.json dist/SHA256SUMS "${extra[@]}"
              echo "$RELEASE_TAG: images unchanged; recorded the new pipeline fingerprint." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$RELEASE_TAG already exists with different images (PolyCI's packaging changed). Left it unchanged; this lab will keep fully rebuilding until its commit or baseline changes, or you delete that release so it can be republished."
            fi
            exit 0
          fi
          cat > notes.md <<EOF
          **$TITLE** packaged on baseline \`$BASELINE_TAG\`.

          | | |
          |---|---|
          | Lab | $REPO @ \`${REF:0:12}\` (folder \`$SUBDIR\`) |
          | Baseline | \`$BASELINE_TAG\` |
          | Join | \`packaged.rootfs.cpio.gz\` = baseline \`rootfs.cpio.gz\` + \`lab.cpio.gz\` |

          Boot \`packaged.bzImage\` with \`packaged.rootfs.cpio.gz\` as the initrd (v86 or QEMU).
          EOF
          if [ -f dist/site.tar.gz ]; then
            printf '\nThis lab gets its values from the PolyLab server: unpack `site.tar.gz` into the\nserver site folder `%s/` (see server/README.md). It is not on GitHub Pages.\n' "$LAB" >> notes.md
          fi
          extra=(); [ ! -f dist/site.tar.gz ] || extra=(dist/site.tar.gz)
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "$TITLE (${REF:0:7} on $BASELINE_TYPE ${BASELINE_TAG##*-})" --notes-file notes.md \
            dist/packaged.bzImage dist/packaged.rootfs.cpio.gz dist/lab.cpio.gz \
            dist/lab-manifest.txt dist/release.json dist/SHA256SUMS "${extra[@]}"
          echo "Published **$RELEASE_TAG**" >> "$GITHUB_STEP_SUMMARY"

  # Labs made of several VMs on one page (labs.<id>.vms, e.g. netsec-snort).
  # Same modes as the lab job; scripts/group.py does the per-VM work.
  group:
    name: lab (${{ matrix.lab }}, ${{ join(matrix.vms.*.name, ' + ') }})
    needs: [plan, tools]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.group_count != '0' && needs.tools.result != 'failure' && needs.tools.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write   # publish <lab>-...-release (only on the default branch)
      packages: read    # pull the tools image
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      LAB: ${{ matrix.lab }}
      TITLE: ${{ matrix.title }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      MODE: ${{ matrix.mode }}
      TOOLS_IMAGE: ${{ needs.tools.outputs.image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: "Mode: ${{ matrix.mode }}"
        env:
          WHY: ${{ matrix.why }}
        run: |
          echo "$LAB: $MODE ($WHY)"
          echo "**$LAB**: $MODE ($WHY)" >> "$GITHUB_STEP_SUMMARY"
          [ "$MODE" != skip ] || echo "::notice::$LAB skipped: $WHY. Run Publish baseline, then pin it in polyci.json."

      - name: Start pulling the tools image
        if: matrix.mode == 'build'
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ( docker pull -q "$TOOLS_IMAGE" > "$RUNNER_TEMP/pull.log" 2>&1; echo $? > "$RUNNER_TEMP/pull.rc" ) &

      - name: Check out PolyCI
        if: matrix.mode != 'skip'
        uses: actions/checkout@v7
        with:
          path: polyci

      - name: Save this lab's plan
        if: matrix.mode != 'skip'
        env:
          GROUP: ${{ toJSON(matrix) }}
        run: printf '%s\n' "$GROUP" > group.json

      - name: Download released images (${{ matrix.release_tag }})
        if: matrix.mode == 'reuse'
        run: python3 polyci/scripts/group.py fetch --group group.json --out out --repo "$GITHUB_REPOSITORY"

      - name: Build every VM's image (baseline + overlay) and verify it
        if: matrix.mode == 'build'
        run: python3 polyci/scripts/group.py build --group group.json --out out --work work

      - name: v86 settings
        if: matrix.mode != 'skip'
        id: v86
        run: |
          jq -r '"version=\(.v86.npm_version)\nbios_repo=\(.v86.bios_repo)\nbios_ref=\(.v86.bios_ref)"' \
            polyci/polyci.json >> "$GITHUB_OUTPUT"

      - name: Check out v86 BIOS files
        if: matrix.mode != 'skip'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.v86.outputs.bios_repo }}
          ref: ${{ steps.v86.outputs.bios_ref }}
          path: v86src
          sparse-checkout: bios
          sparse-checkout-cone-mode: false

      - name: Assemble the multi-VM page
        if: matrix.mode != 'skip'
        env:
          V86_VERSION: ${{ steps.v86.outputs.version }}
          LABEL: ${{ matrix.release_tag }}
        run: bash polyci/scripts/assemble-site.sh out v86src/bios site

      - name: Cache the page test's browser driver
        if: matrix.mode == 'build'
        id: pt-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/polyci-page-test
          key: puppeteer-core-24-${{ runner.os }}

      - name: Install the page test's browser driver
        if: matrix.mode == 'build' && steps.pt-cache.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.cache/polyci-page-test --silent --no-audit --no-fund puppeteer-core@24

      - name: Boot test (QEMU, all VMs on one network) and page test (Chrome), in parallel
        if: matrix.mode == 'build'
        timeout-minutes: 40
        run: |
          while [ ! -f "$RUNNER_TEMP/pull.rc" ]; do sleep 1; done
          [ "$(cat "$RUNNER_TEMP/pull.rc")" = 0 ] || { cat "$RUNNER_TEMP/pull.log"; echo "::error::could not pull $TOOLS_IMAGE"; exit 1; }
          kvm=(); flag=
          if [ -e /dev/kvm ]; then kvm=(--device /dev/kvm); flag=--kvm; fi
          echo "KVM: ${flag:-not available, using emulation}"

          docker run --rm "${kvm[@]}" -v "$PWD:/w" -w /w "$TOOLS_IMAGE" \
            python3 polyci/scripts/boot-test-multi.py --images out --log-dir out $flag \
            > out/boot-test.txt 2>&1 &
          boot=$!

          pt=~/.cache/polyci-page-test
          cp polyci/scripts/page-test-multi.mjs "$pt/"
          python3 -m http.server 8080 --directory site --bind 127.0.0.1 >/dev/null 2>&1 &
          node "$pt/page-test-multi.mjs" http://127.0.0.1:8080/ out/page-shots > out/page-test.txt 2>&1 &
          page=$!

          b=0; wait "$boot" || b=$?
          p=0; wait "$page" || p=$?
          echo "::group::Boot test (exit $b)"; cat out/boot-test.txt; echo "::endgroup::"
          echo "::group::Page test (exit $p)"; cat out/page-test.txt; echo "::endgroup::"
          grep -h '^::error::' out/boot-test.txt out/page-test.txt || true
          echo "boot test: $([ $b = 0 ] && echo passed || echo FAILED)   page test: $([ $p = 0 ] && echo passed || echo FAILED)"
          [ "$b" = 0 ] && [ "$p" = 0 ]

      - name: Upload test logs and screenshots
        if: always() && matrix.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.lab }}
          path: |
            out/boot-*.log
            out/boot-test.txt
            out/page-test.txt
            out/page-shots/
          if-no-files-found: ignore

      - name: Release files
        if: matrix.mode == 'build'
        run: python3 polyci/scripts/group.py release --group group.json --out out --dist dist

      - name: Upload images
        if: matrix.mode == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release_tag }}
          path: dist/

      - name: Upload site for the Pages deploy
        if: matrix.mode != 'skip'
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.lab }}
          path: site/
          retention-days: 7

      - name: Publish ${{ matrix.release_tag }}
        if: matrix.mode == 'build' && needs.plan.outputs.publish == 'true'
        run: |
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Rebuilt because PolyCI's pipeline changed. If every VM's images are
            # byte-identical, just record the new fingerprint; never replace images.
            gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p release.json -O old-release.json
            same=$(python3 -c "
          import json
          o, n = json.load(open('old-release.json')), json.load(open('dist/release.json'))
          keys = ('packaged_rootfs_sha256', 'lab_cpio_sha256')
          print(all(o['vms'].get(v, {}).get(k) == n['vms'][v][k] for v in n['vms'] for k in keys))")
            if [ "$same" = True ]; then
              gh release upload "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --clobber dist/release.json dist/SHA256SUMS
              echo "$RELEASE_TAG: images unchanged; recorded the new pipeline fingerprint." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::$RELEASE_TAG already exists with different images. Left it unchanged; delete that release to let it be republished."
            fi
            exit 0
          fi
          python3 - <<'PY' > notes.md
          import json
          r = json.load(open("dist/release.json"))
          print(f"**{r['title']}**: {len(r['vms'])} VMs on one page.\n")
          print("| VM | Lab repo | Baseline | Page |")
          print("|---|---|---|---|")
          for name, v in r["vms"].items():
              print(f"| `{name}` | {v['repo']} @ `{v['commit'][:12]}` | `{v['baseline']['tag']}` | "
                    f"{'visible' if v['visible'] else 'hidden (Web Worker)'}, {v['memory_mb']} MB |")
          print("\nEach VM: boot `<vm>.bzImage` with `<vm>.rootfs.cpio.gz` "
                "(= baseline rootfs + `<vm>.lab.cpio.gz`), all on one Ethernet segment, "
                "with the same `polylab_email_hex`/`polylab_date`/`polylab_code` on every kernel command line.")
          PY
          gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "$TITLE (${RELEASE_TAG#"$LAB"-})" --notes-file notes.md dist/*
          echo "Published **$RELEASE_TAG**" >> "$GITHUB_STEP_SUMMARY"

  # One required check for branch protection, however many labs there are.
  all-labs:
    name: all labs pass
    needs: [plan, tools, lab, group]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          TOOLS: ${{ needs.tools.result }}
          LAB: ${{ needs.lab.result }}
          GROUP: ${{ needs.group.result }}
        run: |
          echo "plan: $PLAN  tools: $TOOLS  labs: $LAB  multi-VM labs: $GROUP"
          [ "$PLAN" = success ] || exit 1
          for r in "$TOOLS" "$LAB" "$GROUP"; do [ "$r" = success ] || [ "$r" = skipped ] || exit 1; done

  # After a passing baseline test with "promote": un-pre-release the tested
  # baselines and open (or refresh) a PR that pins them in polyci.json.
  # main is protected, so the pin lands through review and the required
  # check; merging it publishes the labs on the new baseline. Same token
  # note as update-labs.yml: with only GITHUB_TOKEN, CI will not start on the
  # PR by itself (close and reopen it, or add POLYCI_BOT_TOKEN).
  pin:
    name: Promote and pin tested baselines
    needs: [plan, all-labs]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.promote &&
      needs.all-labs.result == 'success' &&
      needs.plan.outputs.overrides != '{}' && needs.plan.outputs.overrides != '' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # edit the baseline releases, push the PR branch
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.POLYCI_BOT_TOKEN || github.token }}
      OVERRIDES: ${{ needs.plan.outputs.overrides }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.POLYCI_BOT_TOKEN || github.token }}

      - name: Mark the tested baselines as full releases
        run: |
          for tag in $(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["OVERRIDES"]).values()))'); do
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --prerelease=false --latest=false
            echo "Promoted **$tag**" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Open or update the pin pull request
        env:
          BRANCH: polyci/pin-baselines
          HAS_BOT_TOKEN: ${{ secrets.POLYCI_BOT_TOKEN != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/pin-baselines.py "$OVERRIDES" | tee changes.txt
          if git diff --quiet polyci.json; then
            echo "polyci.json already pins these baselines; no PR needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "Pins baseline(s) that passed every lab test in $RUN_URL:"; echo
            sed 's/^/- /' changes.txt; echo
            echo "They are now full releases. Merging this publishes the labs on them."
            [ "$HAS_BOT_TOKEN" = true ] || printf '\n> Opened with the built-in token, so CI will not start on its own: close and reopen this PR to run it (or add a POLYCI_BOT_TOKEN secret).\n'
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -m "Pin tested baselines" polyci.json
          git push --force origin "$BRANCH"
          if pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number') && [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file body.md
            echo "Updated PR #$pr" >> "$GITHUB_STEP_SUMMARY"
          else
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Pin tested baselines" --body-file body.md
            echo "Opened a PR from $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Weekly run only: once every lab has passed and the site is deployed,
  # delete releases nothing uses any more (Clean up releases, with its
  # defaults: keep one previous release per lab and baseline type, and
  # anything younger than 7 days).
  cleanup:
    name: Clean up unused releases
    needs: [plan, all-labs, pages]
    if: >-
      always() && github.event_name == 'schedule' &&
      needs.plan.outputs.publish == 'true' &&
      needs.all-labs.result == 'success' && needs.pages.result == 'success'
    permissions:
      contents: write   # delete releases and tags
    uses: ./.github/workflows/cleanup.yml
    with:
      delete: true

  pages:
    name: Deploy to GitHub Pages
    needs: [plan, lab, group]
    if: >-
      always() && needs.plan.outputs.publish == 'true' &&
      (needs.lab.result == 'success' || needs.lab.result == 'skipped') &&
      (needs.group.result == 'success' || needs.group.result == 'skipped') &&
      (needs.lab.result == 'success' || needs.group.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Download lab sites
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: sites
      - name: Combine into one site
        run: |
          mkdir -p public
          for d in sites/site-*; do
            [ -d "$d" ] || continue
            # Labs whose values come from the PolyLab server need it to run,
            # which GitHub Pages cannot do: they are deployed to the server.
            if python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("server") else 1)' "$d/build.json" 2>/dev/null; then
              echo "${d#sites/site-}: needs the PolyLab server; not on Pages"
              continue
            fi
            cp -r "$d" "public/${d#sites/site-}"
          done
          python3 scripts/make-landing.py public
          find public -maxdepth 2 -name index.html | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
